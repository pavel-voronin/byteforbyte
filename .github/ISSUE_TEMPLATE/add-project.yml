name: Add a project
description: Suggest a byte-for-byte restoration for the catalog.
body:
  - type: input
    id: project_name
    attributes:
      label: Project name
      placeholder: Dangerous Dave in the Haunted Mansion
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Project repository URL
      placeholder: https://github.com/owner/project
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Original platform
      placeholder: DOS
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Game
        - Software
    validations:
      required: true
  - type: input
    id: technologies
    attributes:
      label: Technology stack
      description: List languages, engines or key build tools for the matching release, separated by commas.
      placeholder: "C, x86 Assembly, Borland C++ 2.0"
  - type: input
    id: credit
    attributes:
      label: Restorer
      placeholder: Name or GitHub handle
    validations:
      required: true
  - type: input
    id: credit_url
    attributes:
      label: Restorer URL
      description: Link to the restorer’s GitHub profile or website, if available.
      placeholder: https://github.com/owner
  - type: input
    id: release_year
    attributes:
      label: Original release year
      description: Enter the four-digit year of the version that matches byte for byte, if known.
      placeholder: "1996"
  - type: input
    id: target
    attributes:
      label: "What matches the original?"
      description: Name the original release and the file or scope that matches byte for byte.
      placeholder: "Registered DOS v1.3D / DUKE3D.EXE"
    validations:
      required: true
  - type: input
    id: play_url
    attributes:
      label: Playable version URL
      description: Link to the version that can be played in a browser, if available.
      placeholder: https://example.org/play
  - type: upload
    id: screenshot
    attributes:
      label: Screenshot
      description: >
        Attach one PNG, JPEG, or WebP screenshot of the restored game or program for its catalog card.
        Use the original aspect ratio. A clear in-game or in-app view without browser chrome is preferred.
    validations:
      accept: ".png,.jpg,.jpeg,.webp"
  - type: input
    id: evidence
    attributes:
      label: Byte-for-byte evidence URL
      description: Link to the recorded comparison or steps to reproduce it.
      placeholder: https://github.com/owner/project#verification
    validations:
      required: true

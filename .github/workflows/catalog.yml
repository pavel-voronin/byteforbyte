name: Catalog
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/site.js
      - run: node build.mjs
        env:
          CATALOG_REVISION: ${{ github.sha }}
          CATALOG_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/upload-artifact@v4
        with:
          name: bytetobyte
          path: dist/
          if-no-files-found: error

  publish-server-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-and-build
    runs-on: ubuntu-latest
    concurrency:
      group: catalog-production
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bytetobyte
          path: dist/
      - name: Publish the current main build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo 'A newer commit is already on main.'
            exit 0
          fi
          cp dist/index.html "$RUNNER_TEMP/catalog.html"
          if gh release view catalog-production >/dev/null 2>&1; then
            gh release upload catalog-production "$RUNNER_TEMP/catalog.html" --clobber
          else
            gh release create catalog-production "$RUNNER_TEMP/catalog.html" --target "$GITHUB_SHA" --title 'Catalog build for Caddy' --notes 'Current CI build for bytetobyte.dev.' --prerelease
          fi

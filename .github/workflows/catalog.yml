name: Catalog
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'github-actions[bot]' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !startsWith(github.head_ref, 'catalog/batch-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/site.js
      - run: node build.mjs
        env:
          CATALOG_REVISION: ${{ github.sha }}
          CATALOG_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/upload-artifact@v4
        with:
          name: byteforbyte
          path: dist/
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate-and-build
    runs-on: ubuntu-latest
    concurrency:
      group: catalog-production
      queue: max
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: byteforbyte
          path: dist/
      - name: Deploy the current main build
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo 'A newer commit is already on main.'
            exit 0
          fi
          endpoint=https://byteforbyte.dev/_deploy/catalog
          token=$(curl --silent --show-error --fail --max-time 15 --get \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=$endpoint" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -er '.value')
          echo "::add-mask::$token"
          curl --silent --show-error --fail-with-body --max-time 30 \
            --header "Authorization: Bearer $token" --header 'Content-Type: text/html' \
            --upload-file dist/index.html "$endpoint"
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Close published catalog submissions
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          live="$RUNNER_TEMP/published-catalog.html"
          curl --silent --show-error --fail --max-time 15 --retry 3 \
            --output "$live" "https://byteforbyte.dev/?revision=$GITHUB_SHA"
          grep -Fxq "<meta name=\"catalog-revision\" content=\"$GITHUB_SHA\">" "$live"
          published=$(sed -n 's|^<script id="site-data" type="application/json">\(.*\)</script>$|\1|p' "$live" |
            jq -cre '.projects | map(.id | select(test("^proposal-[1-9][0-9]*$")) | ltrimstr("proposal-"))')
          merged=$(gh api --paginate "repos/$GH_REPO/pulls?state=closed&base=main&per_page=100" |
            jq -cs '[.[][] | select(.merged_at != null and .user.login == "github-actions[bot]" and
              .head.repo.full_name == .base.repo.full_name) |
              if .head.ref | test("^catalog/issue-[1-9][0-9]*$") then
                .head.ref | ltrimstr("catalog/issue-")
              elif .head.ref | test("^catalog/batch-[1-9][0-9]*$") then
                (.body // "") | split("\\n")[] |
                select(test("^Catalog submission: #[1-9][0-9]*$")) | ltrimstr("Catalog submission: #")
              else empty end]')
          issues=$(gh api --paginate "repos/$GH_REPO/issues?state=open&per_page=100" |
            jq -r --argjson published "$published" --argjson merged "$merged" '
              .[] | select(.pull_request == null) | (.number | tostring) as $id |
              select(($published | index($id)) != null and ($merged | index($id)) != null) | .number')
          for number in $issues; do
            gh api --method PATCH "repos/$GH_REPO/issues/$number" \
              -f state=closed -f state_reason=completed --silent
            echo "Closed published catalog issue #$number."
            sleep 1
          done

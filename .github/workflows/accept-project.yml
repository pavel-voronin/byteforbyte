name: Accept catalog projects
on:
  issues:
    types: [labeled]

permissions:
  actions: write
  issues: read
  contents: write
  pull-requests: write

jobs:
  accept:
    # 98917699 is the GitHub account ID of PaulArgent.
    if: >-
      github.event.label.name == 'accepted' &&
      (github.event.sender.login == github.repository_owner || github.event.sender.id == 98917699)
    concurrency:
      group: accept-catalog-project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot encoder
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-pil
      - run: node scripts/accept-project.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
